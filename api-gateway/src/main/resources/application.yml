server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # ==============================================================================
        # 1. CORE MICROSERVICES
        # ==============================================================================

        # ---- User Service: Auth & Profile ----
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/users/**
          filters:
            - name: AuthFilter
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/users

        # ---- Restaurant Service ----
        - id: restaurant-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/restaurants/**
          filters:
            - name: AuthFilter
            - name: CircuitBreaker
              args:
                name: restaurantServiceCB
                fallbackUri: forward:/fallback/restaurants

        # ---- Order Service ----
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**
          filters:
            - name: AuthFilter
            - name: CircuitBreaker
              args:
                name: orderServiceCB
                fallbackUri: forward:/fallback/orders

        # ---- Delivery Service ----
        - id: delivery-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/delivery/**
          filters:
            - name: AuthFilter
            - name: CircuitBreaker
              args:
                name: deliveryServiceCB
                fallbackUri: forward:/fallback/delivery

        # ==============================================================================
        # 2. SWAGGER / OPENAPI DOCS PROXY ROUTES (No AuthFilter, Direct Forwarding)
        # ==============================================================================

        - id: user-service-docs
          uri: http://localhost:8081
          predicates:
            - Path=/v3/api-docs/user-service/**
          filters:
            - RewritePath=/v3/api-docs/user-service(?<segment>.*), /v3/api-docs$\{segment}

        - id: restaurant-service-docs
          uri: http://localhost:8082
          predicates:
            - Path=/v3/api-docs/restaurant-service/**
          filters:
            - RewritePath=/v3/api-docs/restaurant-service(?<segment>.*), /v3/api-docs$\{segment}

        - id: order-service-docs
          uri: http://localhost:8083
          predicates:
            - Path=/v3/api-docs/order-service/**
          filters:
            - RewritePath=/v3/api-docs/order-service(?<segment>.*), /v3/api-docs$\{segment}

        - id: delivery-service-docs
          uri: http://localhost:8084
          predicates:
            - Path=/v3/api-docs/delivery-service/**
          filters:
            - RewritePath=/v3/api-docs/delivery-service(?<segment>.*), /v3/api-docs$\{segment}

# ==============================================================================
# 3. UNIFIED SWAGGER UI AGGREGATION
# ==============================================================================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. User Service
        url: /v3/api-docs/user-service
      - name: 2. Restaurant Service
        url: /v3/api-docs/restaurant-service
      - name: 3. Order Service
        url: /v3/api-docs/order-service
      - name: 4. Delivery Service
        url: /v3/api-docs/delivery-service

# ==============================================================================
# 4. RESILIENCE4J & LOGGING
# ==============================================================================
resilience4j:
  circuitbreaker:
    instances:
      userServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      restaurantServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      orderServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      deliveryServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.foodapp.gateway: DEBUG